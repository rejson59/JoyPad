name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # Wszystkie selftesty bez przeglądarki: protokół, silniki arcade, konsola,
      # haptyka, relay MQTT, platforma, powtórki, film, nowe gry i dym interfejsu.
      - name: Selftesty (model, silniki, konsola, film, UI)
        run: npm run selftest:all
      - name: Chromium for video replay tests
        run: npx playwright install --with-deps chromium
      - name: Real video capture and playback (2D, WebGL, split-screen)
        run: npm run test:replay
      - name: Build (base GitHub Pages)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Bramki na PRAWDZIWYM artefakcie: import zminifikowanego bundla w jsdom
      # (czarny ekran po złym podziale chunków wychodzi tu, nie u gracza) oraz
      # sprawdzenie, że serwer podaje każdy zasób, którego żąda index.html.
      - name: Smoke produkcyjnego bundla (Pages)
        run: JOYPAD_PREVIEW_DIR=dist JOYPAD_BOOT_DIR=.cache/boot-test npm run selftest:preview
      - name: Delivery — serwer podaje build z Pages
        run: |
          PREVIEW_DIR=dist node scripts/preview-server.mjs 5176 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:5176/" > /dev/null && break
            sleep 1
          done
          node scripts/preview-check.mjs 5176
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS
