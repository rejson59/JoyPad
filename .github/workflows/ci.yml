name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Selftest — protokół i silniki arcade
        run: npm run selftest:arcade
      - name: Selftest — awaryjny przekaźnik MQTT
        run: npm run selftest:relay
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
