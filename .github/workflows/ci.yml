name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Selftest — protokół i silniki arcade
        run: npm run selftest:arcade
      - name: Selftest — system konsoli i haptyka
        run: npm run selftest:console
      - name: Selftest — awaryjny przekaźnik MQTT
        run: npm run selftest:relay
      - name: Selftest — platforma i cykl życia powtórek
        run: |
          npm run selftest:platform
          npm run selftest:replay
      - name: Chromium for video replay tests
        run: npx playwright install --with-deps chromium
      - name: Real video capture and playback (2D, WebGL, split-screen)
        run: npm run test:replay
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
