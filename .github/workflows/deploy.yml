name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ten sam zestaw co w CI — bramka jakości przed publikacją na Pages.
      - name: Lint i typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Selftesty przed deployem
        run: npm run selftest:all
      # Strona projektu leży pod https://<user>.github.io/<repo>/ → base = /<repo>/
      # (dla repo <user>.github.io ustaw VITE_BASE=/)
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Opcjonalne sekrety repozytorium. Gdy nie są ustawione, aplikacja
          # korzysta ze współdzielonego (i mniej niezawodnego) Open Relay.
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      # Publikujemy tylko artefakt, który sam się uruchamia i podaje wszystkie zasoby.
      - name: Smoke produkcyjnego bundla (Pages)
        run: JOYPAD_PREVIEW_DIR=dist JOYPAD_BOOT_DIR=.cache/boot-test npm run selftest:preview
      - name: Delivery — serwer podaje artefakt Pages
        run: |
          PREVIEW_DIR=dist node scripts/preview-server.mjs 5176 &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:5176/" > /dev/null && break
            sleep 1
          done
          node scripts/preview-check.mjs 5176
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
